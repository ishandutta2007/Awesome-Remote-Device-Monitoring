<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes flowPacket {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beaconPing {
        0% { r: 6; opacity: 0.9; }
        100% { r: 24; opacity: 0; }
      }
      @keyframes blinkLight {
        0%, 100% { opacity: 1; fill: #10b981; }
        50% { opacity: 0.3; fill: #059669; }
      }
      @keyframes sweepRadar {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .telemetry-line {
        stroke-dasharray: 8 6;
        animation: flowPacket 3s linear infinite;
      }
      .telemetry-line-rev {
        stroke-dasharray: 10 8;
        animation: flowPacket 4s linear infinite reverse;
      }
      .beacon-ring-1 {
        animation: beaconPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-origin: 1050px 180px;
      }
      .beacon-ring-2 {
        animation: beaconPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite 1s;
        transform-origin: 1050px 180px;
      }
      .status-led {
        animation: blinkLight 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Decorative Gradient Orbs -->
  <circle cx="150" cy="80" r="180" fill="#0284c7" opacity="0.12" filter="url(#cyanGlow)"/>
  <circle cx="1050" cy="180" r="160" fill="#7c3aed" opacity="0.15" filter="url(#purpleGlow)"/>

  <!-- Left Accent / Frame lines -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="0" y1="360" x2="1200" y2="360" stroke="#818cf8" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Telemetry Network Bus / Data Paths -->
  <g opacity="0.85">
    <path d="M 60 280 L 180 280 L 260 200 L 400 200" fill="none" stroke="#0ea5e9" stroke-width="1.8" class="telemetry-line"/>
    <path d="M 180 280 L 240 320 L 500 320" fill="none" stroke="#6366f1" stroke-width="1.5" class="telemetry-line-rev"/>
    <path d="M 750 140 L 880 140 L 940 180 L 1050 180" fill="none" stroke="#a855f7" stroke-width="2" class="telemetry-line"/>
    <path d="M 880 140 L 920 80 L 1120 80" fill="none" stroke="#06b6d4" stroke-width="1.5" class="telemetry-line-rev"/>
    <path d="M 940 180 L 1000 260 L 1140 260" fill="none" stroke="#3b82f6" stroke-width="1.8" class="telemetry-line"/>
  </g>

  <!-- Right Node: Central Monitoring Hub / Radar -->
  <g transform="translate(0, 0)">
    <circle cx="1050" cy="180" r="70" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="1050" cy="180" r="45" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="1050" cy="180" r="22" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <circle class="beacon-ring-1" cx="1050" cy="180" r="6" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle class="beacon-ring-2" cx="1050" cy="180" r="6" fill="none" stroke="#c084fc" stroke-width="2"/>
    <circle cx="1050" cy="180" r="7" fill="#38bdf8" filter="url(#cyanGlow)"/>

    <!-- Orbiting Satellite / Edge Nodes -->
    <circle cx="940" cy="180" r="5" fill="#10b981"/>
    <circle cx="880" cy="140" r="4.5" fill="#38bdf8"/>
    <circle cx="1000" cy="260" r="4.5" fill="#a855f7"/>
    <circle cx="920" cy="80" r="4" fill="#f59e0b"/>
    <circle cx="1120" cy="80" r="4.5" fill="#10b981"/>
    <circle cx="1140" cy="260" r="5" fill="#06b6d4"/>
  </g>

  <!-- Title Badge (Top Left) -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="260" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle class="status-led" cx="14" cy="14" r="5"/>
    <text x="28" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">LIVE FLEET TELEMETRY</text>
  </g>

  <!-- Main Headers -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      Remote Device Monitoring
    </text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Curated Ecosystem of SaaS Platforms, Open-Source Stacks, Gateways &amp; Digital Twins
    </text>
  </g>

  <!-- Stats / Category Pills (Bottom Left) -->
  <g transform="translate(80, 220)">
    <!-- Pill 1: Protocols -->
    <rect x="0" y="0" width="170" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ MQTT • CoAP • LwM2M</text>

    <!-- Pill 2: Diagnostics -->
    <rect x="185" y="0" width="180" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="199" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#818cf8">📡 OTA &amp; Diagnostics</text>

    <!-- Pill 3: Edge & Cloud -->
    <rect x="380" y="0" width="170" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="394" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🌐 Edge &amp; Cloud Twins</text>

    <!-- Pill 4: Industrial SCADA -->
    <rect x="565" y="0" width="165" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="579" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">🏭 Industrial IIoT</text>
  </g>

  <!-- Footer indicator line -->
  <g transform="translate(80, 290)">
    <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.5">
      REAL-TIME TELEMETRY • FLEET HEALTH • REMOTE CONFIGURATION • TIME-SERIES ANALYTICS
    </text>
  </g>
</svg>